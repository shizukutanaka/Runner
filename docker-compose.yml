# 本番用コンテナ構成。
#
# 以前はここに nginx / prometheus / grafana / backup の4サービスが並んでいたが、
# いずれもリポジトリに存在しないファイルを参照していた:
#   ./nginx/nginx.conf, ./nginx/ssl, ./monitoring/prometheus.yml,
#   ./monitoring/grafana/dashboards, ./monitoring/grafana/datasources,
#   backend/src/scripts/backup-cron.js
# 加えて nginx サービスはフロントエンドと同じ80番を取り合っていた。
# 一度も起動されたことのない構成なので削除した。TLS終端とメトリクス収集が
# 必要になった時点で、実在するファイルと共に足し直すこと。
#
# 現在の構成は backend / frontend / redis の3つ。フロントエンドのnginxが
# /api と /socket.io を backend にプロキシするので、公開ポートは1つで済む。

services:
  # バックエンドAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comment-manager-backend
    restart: unless-stopped
    # 既定では外部公開しない（frontend のnginx経由で到達する）。
    # 直接叩きたい場合は BACKEND_PORT を設定して下の行を有効化する
    expose:
      - "4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_PATH: /app/data/comments.db
      REDIS_URL: redis://redis:6379
      SESSION_STORE: redis
      SESSION_REDIS_URL: redis://redis:6379
      RATE_LIMIT_STORE: redis
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:8080}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
      - backend_backups:/app/backups
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy

  # フロントエンド（静的ビルド + リバースプロキシ）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comment-manager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app_network
    depends_on:
      - backend

  # セッションストア兼レートリミッタのバックエンド
  redis:
    image: redis:7-alpine
    container_name: comment-manager-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  backend_data:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
