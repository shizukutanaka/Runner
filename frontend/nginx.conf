# フロントエンドコンテナのnginx設定。
#
# **HTTPSが必須である理由（D-7以降）**: 認証Cookieに `Secure` 属性が付くため、
# 平文HTTPではブラウザがCookieを保存せず、**ログインが成立しない**。
# したがってこのコンテナ自身がTLSを終端する。証明書が用意されていない場合は
# 起動時に自己署名証明書を生成する（docker-entrypoint.sh）ので、
# 何も設定しなくても動く状態にはなる。本番では
# `./certs` に実際の証明書（fullchain.pem / privkey.pem）を置いて差し替えること。
#
# 以前はこの内容をDockerfile内のヒアドキュメントで生成していたが、
# (1) レビューも編集もできない (2) /api と /socket.io のプロキシが一切無く、
# ビルド済みSPAはバックエンドに到達できなかった、という二重の問題があった。
# フロントのコードは既定で同一オリジンの `/api` を叩き、socket.io も
# window.location.origin に接続する（frontend/src/api/*.js, frontend/src/ws.js）ため、
# このリバースプロキシが無いと本番コンテナは必ず404になる。

upstream backend_upstream {
    # docker-compose のサービス名。compose外で使う場合はここを書き換える
    server backend:4000;
    keepalive 16;
}

# ポート80: ヘルスチェックだけ通し、それ以外はHTTPSへ恒久リダイレクトする。
# `/health` を除外しているのは、コンテナのヘルスチェックが
# リダイレクトで失敗しないようにするため
server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # HTTP/2 は意図的に有効化していない。`http2 on;` は nginx 1.25.1 以降の構文で、
    # 旧来の `listen ... ssl http2;` は 1.25.1 以降で非推奨警告を出す。
    # ベースイメージの正確なパッチバージョンを固定・検証できていない状態で
    # どちらかを書くと、環境によって起動に失敗するか警告が出続ける。
    # 本アプリの規模ではHTTP/1.1 over TLSで十分なので、
    # バージョンを固定できた時点で有効化すること
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # アップロードされる証跡ファイルを考慮したサイズ上限
    client_max_body_size 10m;

    # セキュリティヘッダ
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HTTPS前提になったので HSTS を出す（自己署名のままの環境では
    # ブラウザに固定されてしまうので、独自ドメインで運用する時のみ有効化推奨）
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # REST API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # socket.io（リアルタイム通知・レイド警報）。Upgradeヘッダを通さないと
    # ポーリングにフォールバックし続けるか、接続そのものが失敗する
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ハッシュ付きの静的アセットのみ長期キャッシュ
    # `expires` は独自にCache-Controlを出すため、add_headerと併用すると
    # Cache-Controlが二重に付く。add_header側だけを使う
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ドットファイルへのアクセスを拒否
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # index.html はキャッシュさせない（デプロイ後に古いバンドルを掴み続けるのを防ぐ）。
    # nginxのadd_headerは、そのlocationにadd_headerが1つでもあると
    # 上位ブロックの指定を継承しない。try_filesからの内部リダイレクトもこのlocationに
    # 入るためSPAの全ルートが該当する。よってセキュリティヘッダを再掲する。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPAルーティング
    location / {
        try_files $uri $uri/ /index.html;
    }

    # コンテナのヘルスチェック用
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }
}
